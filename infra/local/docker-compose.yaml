name: multiplex-local

services:
  api:
    build: ../..
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-admin}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-admin}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-multiplex-api}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      OTEL_SERVICE_NAME: multiplex-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      APP_PROFILE: local
      APP_CONFIG_DIR: /etc/multiplex
      STORAGE_ENDPOINT_URL: http://rustfs:9000
      STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID:-local-access-key}
      STORAGE_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY:-change-me-local}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-multiplex-local}
    ports: ["${API_PORT:-8000}:8000"]
    volumes: ["../../config:/etc/multiplex:ro"]
    depends_on:
      postgres: {condition: service_started}
      redis: {condition: service_started}
      rabbitmq: {condition: service_started}
      rustfs: {condition: service_healthy}
      alloy: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admin}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    # PostgreSQL 18 stores clusters below /var/lib/postgresql/<major>/docker.
    # Mount the parent directory so pg_upgrade can work across major versions.
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    ports: ["${RABBITMQ_PORT:-5672}:5672", "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY_ID:-local-access-key}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_ACCESS_KEY:-change-me-local}
    command: ["/usr/bin/rustfs", "/data"]
    ports: ["${RUSTFS_API_PORT:-9000}:9000", "${RUSTFS_CONSOLE_PORT:-9001}:9001"]
    volumes: [rustfs-data:/data]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs-init:
    image: amazon/aws-cli:2.27.53
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID:-local-access-key}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY:-change-me-local}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: ["until aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $${STORAGE_BUCKET:-multiplex-local} >/dev/null 2>&1; do aws --endpoint-url http://rustfs:9000 s3 mb s3://$${STORAGE_BUCKET:-multiplex-local} >/dev/null 2>&1 || true; sleep 2; done"]
    depends_on:
      rustfs: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v3.14.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-remote-write-receiver"]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", prometheus-data:/prometheus]

  loki:
    image: grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/config.yml"]
    ports: ["${LOKI_PORT:-3100}:3100"]
    volumes: ["./loki/config.yml:/etc/loki/config.yml:ro", loki-data:/loki]

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo/config.yml"]
    ports: ["${TEMPO_PORT:-3200}:3200"]
    volumes: ["./tempo/config.yml:/etc/tempo/config.yml:ro", tempo-data:/var/tempo]

  alloy:
    image: grafana/alloy:v1.19.2
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data", "--server.http.listen-addr=0.0.0.0:12345"]
    ports: ["${ALLOY_PORT:-12345}:12345", "4317:4317", "4318:4318"]
    volumes:
      - "./alloy/config.alloy:/etc/alloy/config.alloy:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki, prometheus, tempo]

  grafana:
    image: grafana/grafana:13.2.2-slim
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-local-only}
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [loki, prometheus, tempo]

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
  rustfs-data:
